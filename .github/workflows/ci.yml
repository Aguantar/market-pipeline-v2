# CI: 단위 테스트 → (main push 때만) 수집기 이미지 빌드·ghcr push.
# 통합 테스트(tests/test_chsink.py)는 ClickHouse 가 필요해 제외한다. 이 파일은 호스트의 어떤 프로세스도 읽지 않는다 (관찰 규칙 무관).
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"            # pyproject requires-python >=3.12
      - name: Install deps (pyproject dependencies + dev + pyarrow for filesink parquet path)
        run: python -m pip install --quiet "websockets>=13,<15" "clickhouse-connect>=0.8,<0.9" pyarrow "pytest>=8" "pytest-asyncio>=0.24"
      - name: Unit tests (integration tests excluded)
        run: python -m pytest -q --ignore=tests/test_chsink.py
      - uses: actions/setup-go@v5
        with: { go-version: "1.22" }
      - name: Go tests (cd/ 배포기)
        run: cd cd && gofmt -l . && go vet ./... && go test ./...

  changes:
    # build 를 돌릴지 판단: pipeline/** 또는 Dockerfile.collector 가 바뀐 push 만 (docs 커밋마다 수집기가 재배포되는 것을 막는다, docs/05 CD)
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    outputs:
      collector: ${{ steps.diff.outputs.collector }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 2 }
      - id: diff
        run: |
          base="${{ github.event.before }}"
          if ! git cat-file -e "$base" 2>/dev/null || [ "$base" = "0000000000000000000000000000000000000000" ]; then base="HEAD~1"; fi
          if git diff --name-only "$base" HEAD | grep -qE '^(pipeline/|Dockerfile\.collector$)'; then echo "collector=true" >> "$GITHUB_OUTPUT"; else echo "collector=false" >> "$GITHUB_OUTPUT"; fi
          git diff --name-only "$base" HEAD | head -20

  build:
    needs: [test, changes]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.outputs.collector == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write                       # GITHUB_TOKEN 으로 ghcr push. 별도 시크릿 없음
    steps:
      - uses: actions/checkout@v4
      - id: meta
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.collector
          push: true
          tags: |
            ghcr.io/aguantar/market-pipeline-v2-collector:latest
            ghcr.io/aguantar/market-pipeline-v2-collector:sha-${{ steps.meta.outputs.short }}
