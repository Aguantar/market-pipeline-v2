name: 'mp2_analytics'
version: '2.0.0'
config-version: 2
profile: 'mp2'
model-paths: ["models"]
test-paths: ["tests"]
macro-paths: ["macros"]
clean-targets: ["target", "dbt_packages"]
models:
  mp2_analytics:
    +persist_docs: { relation: true, columns: true }
    staging:
      +materialized: view        # raw 를 FINAL 로 읽는 유일한 자리. 중복 제거 규칙은 여기서만 (v1 docs/00 §6)
    intermediate:
      +materialized: table
    quality:
      +materialized: table
