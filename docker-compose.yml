# market-pipeline-v2 (docs/01-design). 수집기는 systemd 대신 compose restart 정책으로 자동 복귀(v1 정전 때 23컨테이너 자동 복귀 실측).
name: mp2
services:
  clickhouse:
    image: clickhouse/clickhouse-server:24.1
    container_name: mp2-clickhouse
    ports:
      - "127.0.0.1:8123:8123"
      - "127.0.0.1:9000:9000"
    environment:
      CLICKHOUSE_DB: mp2
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./clickhouse/config.d/server.xml:/etc/clickhouse-server/config.d/server.xml:ro
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 3G
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --password \"$$CLICKHOUSE_PASSWORD\" --query 'SELECT 1'"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
  upbit-trades:
    build: { context: ., dockerfile: Dockerfile.collector }
    image: mp2-collector
    container_name: mp2-upbit-trades
    command: ["python", "-m", "pipeline.collectors.upbit"]
    environment: { STREAM: trades, CH_HOST: clickhouse, CH_PASSWORD: "${CLICKHOUSE_PASSWORD}", MP2_DATA_ROOT: /data/raw, TZ: UTC }
    volumes: ["./data/raw:/data/raw"]
    user: "1000:1000"
    depends_on: { clickhouse: { condition: service_healthy } }
    restart: unless-stopped
    deploy: { resources: { limits: { memory: 256M } } }
  upbit-orderbook:
    image: mp2-collector
    container_name: mp2-upbit-orderbook
    command: ["python", "-m", "pipeline.collectors.upbit"]
    environment: { STREAM: orderbook, CH_HOST: clickhouse, CH_PASSWORD: "${CLICKHOUSE_PASSWORD}", MP2_DATA_ROOT: /data/raw, TZ: UTC }
    volumes: ["./data/raw:/data/raw"]
    user: "1000:1000"
    depends_on: { clickhouse: { condition: service_healthy }, upbit-trades: { condition: service_started } }
    restart: unless-stopped
    deploy: { resources: { limits: { memory: 384M } } }
  binance-trades:
    image: mp2-collector
    container_name: mp2-binance-trades
    command: ["python", "-m", "pipeline.collectors.binance"]
    environment: { STREAM: trades, CH_HOST: clickhouse, CH_PASSWORD: "${CLICKHOUSE_PASSWORD}", MP2_DATA_ROOT: /data/raw, TZ: UTC }
    volumes: ["./data/raw:/data/raw"]
    user: "1000:1000"
    depends_on: { clickhouse: { condition: service_healthy }, upbit-trades: { condition: service_started } }
    restart: unless-stopped
    deploy: { resources: { limits: { memory: 384M } } }
  binance-depth:
    image: mp2-collector
    container_name: mp2-binance-depth
    command: ["python", "-m", "pipeline.collectors.binance"]
    environment: { STREAM: depth, CH_HOST: clickhouse, CH_PASSWORD: "${CLICKHOUSE_PASSWORD}", MP2_DATA_ROOT: /data/raw, TZ: UTC }
    volumes: ["./data/raw:/data/raw"]
    user: "1000:1000"
    depends_on: { clickhouse: { condition: service_healthy }, upbit-trades: { condition: service_started } }
    restart: unless-stopped
    deploy: { resources: { limits: { memory: 256M } } }

volumes:
  clickhouse_data:
