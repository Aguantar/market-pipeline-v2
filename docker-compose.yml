# market-pipeline-v2 (docs/01-design). 수집기는 systemd 대신 compose restart 정책으로 자동 복귀(v1 정전 때 23컨테이너 자동 복귀 실측).
name: mp2
services:
  clickhouse:
    image: clickhouse/clickhouse-server:24.1
    container_name: mp2-clickhouse
    ports:
      - "127.0.0.1:8123:8123"
      - "127.0.0.1:9000:9000"
    environment:
      CLICKHOUSE_DB: mp2
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./clickhouse/config.d/server.xml:/etc/clickhouse-server/config.d/server.xml:ro
      - ./data:/var/lib/clickhouse/user_files/mp2          # file('mp2/raw/...') 읽기, file('mp2/parquet/...') 쓰기 (압축)
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 3G
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --password \"$$CLICKHOUSE_PASSWORD\" --query 'SELECT 1'"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
  upbit-trades:
    build: { context: ., dockerfile: Dockerfile.collector }
    image: ghcr.io/aguantar/market-pipeline-v2-collector:latest   # CI 가 push, CD(cd/ 배포기)가 pull. 로컬 빌드는 `docker compose build` (build: 유지)
    container_name: mp2-upbit-trades
    command: ["python", "-m", "pipeline.collectors.upbit"]
    environment: { STREAM: trades, CH_HOST: clickhouse, CH_PASSWORD: "${CLICKHOUSE_PASSWORD}", MP2_DATA_ROOT: /data/raw, TZ: UTC }
    volumes: ["./data/raw:/data/raw"]
    user: "1000:1000"
    depends_on: { clickhouse: { condition: service_healthy } }
    restart: unless-stopped
    deploy: { resources: { limits: { memory: 256M } } }
  upbit-orderbook:
    image: ghcr.io/aguantar/market-pipeline-v2-collector:latest   # CI 가 push, CD(cd/ 배포기)가 pull. 로컬 빌드는 `docker compose build` (build: 유지)
    container_name: mp2-upbit-orderbook
    command: ["python", "-m", "pipeline.collectors.upbit"]
    environment: { STREAM: orderbook, CH_HOST: clickhouse, CH_PASSWORD: "${CLICKHOUSE_PASSWORD}", MP2_DATA_ROOT: /data/raw, TZ: UTC }
    volumes: ["./data/raw:/data/raw"]
    user: "1000:1000"
    depends_on: { clickhouse: { condition: service_healthy }, upbit-trades: { condition: service_started } }
    restart: unless-stopped
    deploy: { resources: { limits: { memory: 384M } } }
  binance-trades:
    image: ghcr.io/aguantar/market-pipeline-v2-collector:latest   # CI 가 push, CD(cd/ 배포기)가 pull. 로컬 빌드는 `docker compose build` (build: 유지)
    container_name: mp2-binance-trades
    command: ["python", "-m", "pipeline.collectors.binance"]
    environment: { STREAM: trades, CH_HOST: clickhouse, CH_PASSWORD: "${CLICKHOUSE_PASSWORD}", MP2_DATA_ROOT: /data/raw, TZ: UTC }
    volumes: ["./data/raw:/data/raw"]
    user: "1000:1000"
    depends_on: { clickhouse: { condition: service_healthy }, upbit-trades: { condition: service_started } }
    restart: unless-stopped
    deploy: { resources: { limits: { memory: 384M } } }
  binance-depth:
    image: ghcr.io/aguantar/market-pipeline-v2-collector:latest   # CI 가 push, CD(cd/ 배포기)가 pull. 로컬 빌드는 `docker compose build` (build: 유지)
    container_name: mp2-binance-depth
    command: ["python", "-m", "pipeline.collectors.binance"]
    environment: { STREAM: depth, CH_HOST: clickhouse, CH_PASSWORD: "${CLICKHOUSE_PASSWORD}", MP2_DATA_ROOT: /data/raw, TZ: UTC }
    volumes: ["./data/raw:/data/raw"]
    user: "1000:1000"
    depends_on: { clickhouse: { condition: service_healthy }, upbit-trades: { condition: service_started } }
    restart: unless-stopped
    deploy: { resources: { limits: { memory: 256M } } }

  airflow-postgres:
    image: postgres:15-alpine
    container_name: mp2-airflow-postgres
    environment: { POSTGRES_USER: airflow, POSTGRES_PASSWORD: "${AIRFLOW_POSTGRES_PASSWORD}", POSTGRES_DB: airflow }
    volumes: ["airflow_pg:/var/lib/postgresql/data"]
    restart: unless-stopped
    deploy: { resources: { limits: { memory: 256M } } }
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U airflow"], interval: 15s, timeout: 5s, retries: 5 }

  airflow-init:
    image: mp2-airflow:2.8.1
    container_name: mp2-airflow-init
    environment: &airflow_env
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__FERNET_KEY: "${AIRFLOW_FERNET_KEY}"
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__PARALLELISM: "4"
      AIRFLOW__CORE__MAX_ACTIVE_TASKS_PER_DAG: "4"
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: "postgresql+psycopg2://airflow:${AIRFLOW_POSTGRES_PASSWORD}@airflow-postgres:5432/airflow"
      AIRFLOW__WEBSERVER__DEFAULT_UI_TIMEZONE: Asia/Seoul
      AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "false"
      AIRFLOW__SCHEDULER__DAG_DIR_LIST_INTERVAL: "60"
      AIRFLOW_CONN_CLICKHOUSE_DEFAULT: "http://default:${CLICKHOUSE_PASSWORD}@clickhouse:8123/mp2"
      CH_HOST: clickhouse
      CH_PASSWORD: "${CLICKHOUSE_PASSWORD}"
      SLACK_WEBHOOK_URL: "${SLACK_WEBHOOK_URL:-}"
      MP2_DATA_ROOT: /data/raw
      MP2_PARQUET_ROOT: /data/parquet
      MP2_CH_FILE_PREFIX: mp2                 # ClickHouse user_files 아래 data 마운트 이름
      PYTHONPATH: /opt/airflow
      DBT_LOG_PATH: /tmp/dbt-logs          # dbt 디렉터리는 호스트 uid 1000 소유 bind mount 라 컨테이너(50000)가 못 쓴다
      DBT_TARGET_PATH: /tmp/dbt-target
      AIRFLOW_ADMIN_PASSWORD: "${AIRFLOW_ADMIN_PASSWORD}"
      TZ: UTC
    volumes: &airflow_vols
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/plugins:/opt/airflow/plugins
      - ./airflow/logs:/opt/airflow/logs
      - ./dbt:/opt/airflow/dbt
      - ./pipeline:/opt/airflow/pipeline:ro
      - ./data:/data
      - /home/calme/mp2-secrets:/opt/airflow/secrets:ro
    user: "1000:0"
    group_add: ["101"]          # ClickHouse(uid 101) 가 640 으로 쓴 Parquet 을 읽는다 (v1 과 같은 방식, docs/00 §2)
    depends_on: { airflow-postgres: { condition: service_healthy } }
    # 이미지 entrypoint 를 유지해야 임의 uid(1000) 에 passwd 항목·HOME 이 만들어진다 (덮어쓰면 airflow 모듈을 못 찾는다, 11-24)
    command: ["bash", "-c", "airflow db migrate && (airflow users create -u admin -p \"$$AIRFLOW_ADMIN_PASSWORD\" -f Admin -l User -r Admin -e admin@example.com || true)"]

  airflow-scheduler:
    image: mp2-airflow:2.8.1
    container_name: mp2-airflow-scheduler
    command: scheduler
    environment: *airflow_env
    volumes: *airflow_vols
    user: "1000:0"
    group_add: ["101"]          # ClickHouse(uid 101) 가 640 으로 쓴 Parquet 을 읽는다 (v1 과 같은 방식, docs/00 §2)
    depends_on: { airflow-init: { condition: service_completed_successfully }, clickhouse: { condition: service_healthy } }
    restart: unless-stopped
    deploy: { resources: { limits: { memory: 1G } } }

  airflow-webserver:
    image: mp2-airflow:2.8.1
    container_name: mp2-airflow-webserver
    command: webserver
    ports: ["127.0.0.1:8085:8080"]
    environment: *airflow_env
    volumes: *airflow_vols
    user: "1000:0"
    group_add: ["101"]          # ClickHouse(uid 101) 가 640 으로 쓴 Parquet 을 읽는다 (v1 과 같은 방식, docs/00 §2)
    depends_on: { airflow-init: { condition: service_completed_successfully } }
    restart: unless-stopped
    deploy: { resources: { limits: { memory: 640M } } }
    healthcheck: { test: ["CMD", "curl", "-fs", "http://localhost:8080/health"], interval: 30s, timeout: 10s, retries: 5, start_period: 60s }

volumes:
  clickhouse_data:
  airflow_pg:
