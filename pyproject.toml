[project]
name = "market-pipeline-v2"
version = "0.1.0"
description = "Upbit/Binance market data: websocket -> immutable files + ClickHouse -> dbt. v2 of cdc-realtime-pipeline."
requires-python = ">=3.12"
dependencies = [
  "websockets>=13,<15",
  "clickhouse-connect>=0.8,<0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
